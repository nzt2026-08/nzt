<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1600" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="stone" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#faf9f6"/>
      <stop offset="0.48" stop-color="#e9e9e6"/>
      <stop offset="1" stop-color="#f8f7f3"/>
    </linearGradient>
    <radialGradient id="cloud">
      <stop offset="0" stop-color="#c9cccd" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#c9cccd" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft-vein" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <filter id="stone-grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="2" seed="18"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0.02 0.14"/>
      </feComponentTransfer>
    </filter>
  </defs>
  <rect width="1200" height="1600" fill="url(#stone)"/>

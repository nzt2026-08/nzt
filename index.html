                        Couscous – Lockerer Couscous mit Gemüse
Rezept für 3 Personen

Ein leichtes, aromatisches Couscous-Gericht mit frischem Gemüse, feinen Gewürzen und einem Hauch Zitrone. Perfekt als Hauptgericht oder als Beilage zu Fleisch, Fisch oder Poulet.
🛒 Zutaten
Für den Couscous:
- 250 g Couscous
- 250 ml Gemüsebouillon
- 1 EL Olivenöl
- 1 EL Butter
- ½ TL Salz
- Etwas Pfeffer
Für das Gemüse:
- 1 kleine Zucchini
- 1 rote Paprika
- 1 Karotte
- ½ rote Zwiebel
- 1 Knoblauchzehe
- 100 g Kichererbsen (gekocht)
- 1 EL Olivenöl
Für die Gewürze:
- 1 TL Paprikapulver
- ½ TL Kreuzkümmel
- ½ TL Kurkuma
- ½ TL Zimt (optional)
- Salz und Pfeffer
Zum Garnieren:
- Frische Petersilie oder Minze
- ½ Zitrone
- Optional: 30 g geröstete Mandeln oder Cashewkerne
👨‍🍳 Zubereitung
1. Gemüse vorbereiten

Zucchini, Paprika und Karotte in kleine Würfel schneiden. Zwiebel und Knoblauch fein hacken.

2. Gemüse anbraten

Olivenöl in einer grossen Pfanne erhitzen. Zwiebeln und Knoblauch kurz anbraten.

Karotten, Paprika und Zucchini hinzufügen und etwa 5–7 Minuten braten, bis das Gemüse weich, aber noch leicht bissfest ist.

3. Gemüse würzen

Kichererbsen zum Gemüse geben. Paprikapulver, Kreuzkümmel, Kurkuma, optional Zimt sowie Salz und Pfeffer hinzufügen.

Alles gut vermischen und weitere 2 Minuten braten.

4. Couscous zubereiten

Couscous in eine grosse Schüssel geben.

Gemüsebouillon aufkochen und über den Couscous giessen. Olivenöl hinzufügen und die Schüssel abdecken.

Etwa 5–7 Minuten quellen lassen, bis die Flüssigkeit aufgenommen wurde.

5. Couscous auflockern

Butter hinzufügen und den Couscous mit einer Gabel vorsichtig auflockern, damit er schön locker und körnig wird.

6. Alles vermischen

Das gebratene Gemüse unter den Couscous mischen.

Mit etwas Zitronensaft abschmecken und bei Bedarf Salz und Pfeffer hinzufügen.

7. Servieren

Den Couscous auf drei Teller verteilen und mit frischer Petersilie oder Minze garnieren.

Nach Belieben geröstete Mandeln oder Cashewkerne darüberstreuen.
💡 Tipps
- Für mehr Geschmack kannst du Rosinen oder getrocknete Aprikosen hinzufügen.
- Mit Feta bekommt das Gericht eine cremige, salzige Note.
- Für eine proteinreiche Variante passen Poulet oder zusätzliche Kichererbsen.
- Verwende heisse Bouillon statt Wasser für einen intensiveren Geschmack.
- Ein Spritzer Zitrone macht den Couscous besonders frisch.
⏱️ Zeitangaben
- Vorbereitungszeit: ca. 10 Minuten
- Kochzeit: ca. 15 Minuten
- Quellzeit: ca. 5–7 Minuten
- Gesamtzeit: ca. 30 Minuten
- Portionen: 3 Personen
Guten Appetit! ❤️🥘

                        <span class="recipe-paragraph">Die Pizzen einzeln etwa 10–15 Minuten backen, bis der Rand goldbraun und der Käse geschmolzen ist.</span>

                        <strong class="recipe-step">7. Servieren</strong>
                        <span class="recipe-paragraph">Mit frischem Basilikum und etwas Olivenöl garnieren, in Stücke schneiden und warm servieren.</span>

                        <strong class="recipe-section">Tipps</strong>

                    <span class="card-face card-back" aria-hidden="true">Kartoffelstock – Cremiges Kartoffelpüree
Rezept für 3 Personen

Ein klassischer, wunderbar cremiger Kartoffelstock mit Butter, Milch und einer feinen Muskatnote. Perfekt als Beilage zu Fleisch, Gemüse oder einer leckeren Sauce.
🛒 Zutaten
- 750 g mehligkochende Kartoffeln
- 150 ml Milch
- 40 g Butter
- ½ TL Salz (nach Geschmack)
- 1 Prise Muskatnuss
- Etwas Pfeffer
- Optional: 2 EL Rahm für extra Cremigkeit
👨‍🍳 Zubereitung
1. Kartoffeln vorbereiten

Kartoffeln schälen, waschen und in gleich grosse Stücke schneiden. So werden sie gleichmässig gar.

2. Kartoffeln kochen

Die Kartoffeln in einen Topf geben und mit kaltem Wasser bedecken. Etwas Salz hinzufügen.

Das Wasser zum Kochen bringen und die Kartoffeln etwa 20–25 Minuten kochen lassen, bis sie weich sind.

3. Wasser abgiessen

Das Kochwasser vollständig abgiessen. Die Kartoffeln kurz im warmen Topf ausdampfen lassen, damit überschüssige Feuchtigkeit verschwindet.

4. Kartoffeln zerstampfen

Die Kartoffeln mit einem Kartoffelstampfer oder einer Kartoffelpresse fein zerdrücken.

Wichtig: Keinen Mixer verwenden, da der Kartoffelstock sonst klebrig werden kann.

5. Milch und Butter hinzufügen

Die Milch in einem kleinen Topf erwärmen und zusammen mit der Butter nach und nach zu den Kartoffeln geben.

Alles gut verrühren, bis eine cremige und lockere Konsistenz entsteht.

6. Abschmecken

Mit Salz, Pfeffer und Muskatnuss würzen.

Nach Belieben etwas Rahm hinzufügen, um den Kartoffelstock noch cremiger zu machen.

7. Servieren

Den Kartoffelstock auf drei Teller verteilen und nach Wunsch mit einem kleinen Stück Butter garnieren.
💡 Tipps
- Verwende unbedingt mehligkochende Kartoffeln für einen besonders lockeren Kartoffelstock.
- Die Milch sollte warm sein, damit der Kartoffelstock schön cremig wird.

- Frische Petersilie oder Schnittlauch passen hervorragend dazu.
- Wenn der Kartoffelstock zu fest ist, einfach etwas warme Milch hinzufügen.

                        Gebratener Reis – Asiatischer Fried Rice
Rezept für 3 Personen

Ein aromatischer, gebratener Reis mit knackigem Gemüse, Ei und einer würzigen Sojasauce. Schnell zubereitet, lecker und perfekt als Hauptgericht!
🛒 Zutaten
Für den Reis:
- 300 g Basmatireis oder Jasminreis (ungekocht)
- 3 Eier
- 1 kleine Zwiebel
- 2 Knoblauchzehen
- 1 Karotte
- 100 g Erbsen (tiefgekühlt)
- 1 Frühlingszwiebel
- 2–3 EL Sojasauce
- 1 EL Sesamöl
- 2 EL Pflanzenöl
- Salz und Pfeffer
Optional für mehr Geschmack:
- 150 g Pouletbrust
- 1 TL Ingwer (gerieben)
- 1 TL Austernsauce
- Sesam zum Garnieren
- Etwas Chili
👨‍🍳 Zubereitung
1. Reis kochen

Den Reis gründlich mit kaltem Wasser waschen. Anschliessend nach Packungsanleitung kochen.

Den fertigen Reis abkühlen lassen. Am besten verwendest du Reis vom Vortag, da dieser beim Braten schön locker bleibt.

2. Zutaten vorbereiten

Zwiebel und Knoblauch fein hacken. Die Karotte in kleine Würfel schneiden und die Frühlingszwiebel in feine Ringe schneiden.

Falls du Poulet verwendest, dieses in kleine Stücke schneiden.

3. Eier anbraten

Etwas Pflanzenöl in einer grossen Pfanne oder einem Wok erhitzen.

Die Eier in einer Schüssel verquirlen und in die Pfanne geben. Unter Rühren zu Rührei braten. Anschliessend herausnehmen und beiseitestellen.

4. Gemüse anbraten

Etwas Öl in dieselbe Pfanne geben. Zwiebeln und Knoblauch kurz anbraten.

Karotten und Erbsen hinzufügen und etwa 3–4 Minuten braten.

Falls du Poulet verwendest, dieses separat vollständig durchbraten, bevor du das Gemüse hinzufügst.

5. Reis braten

Den abgekühlten Reis in die Pfanne geben und alles gut vermischen.

Bei hoher Hitze etwa 3–5 Minuten braten, damit der Reis leicht knusprig wird.

6. Würzen

Sojasauce und Sesamöl hinzufügen. Alles gut vermischen.

Das Rührei wieder dazugeben und mit Pfeffer und bei Bedarf etwas Salz abschmecken.

7. Servieren

Den gebratenen Reis auf drei Teller verteilen.

Mit Frühlingszwiebeln und Sesam garnieren. Nach Belieben etwas Chili hinzufügen.
💡 Tipps
- Reis vom Vortag eignet sich besonders gut, weil er weniger Feuchtigkeit enthält.
- Brate den Reis bei hoher Hitze, damit er nicht matschig wird.
- Verwende nicht zu viel Sojasauce, damit der Reis nicht zu salzig wird.
- Für eine vegetarische Variante einfach das Poulet weglassen.
- Du kannst auch Brokkoli, Mais, Paprika oder Pilze hinzufügen.
⏱️ Zeitangaben
- Vorbereitungszeit: ca. 10 Minuten
- Kochzeit: ca. 20 Minuten
- Gesamtzeit: ca. 30 Minuten
- Portionen: 3 Personen

    <script>
        document.querySelectorAll(".flip-card").forEach((card) => {
            card.addEventListener("pointerenter", () => {
                if (!card.classList.contains("is-flipped")) {
                    card.classList.add("is-hovered");
                }
            });
            card.addEventListener("pointerleave", () => {
                card.classList.remove("is-hovered");
            });
            card.addEventListener("click", () => {
                const isFlipped = card.classList.toggle("is-flipped");
                card.setAttribute("aria-pressed", String(isFlipped));
                card.querySelector(".card-back").setAttribute("aria-hidden", String(!isFlipped));
            });
        });
        
    </script>

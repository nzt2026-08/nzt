                    <span class="card-face card-back recipe-back" aria-hidden="true">
                        <strong class="recipe-title">Zutaten</strong>
                        <strong class="recipe-subtitle">Gyozas für 3 Personen</strong>

                        <strong class="recipe-section">Für den Teig</strong>
                        &bull; 250 g Weizenmehl<br>
                        &bull; 125 ml heißes Wasser<br>
                        &bull; 1 Prise Salz<br>
                        Alternativ: fertige Gyoza-Teigblätter verwenden.

                        <strong class="recipe-section">Für die Füllung</strong>
                        &bull; 300 g Hackfleisch (Schwein oder Poulet) oder Tofu<br>
                        &bull; 1 kleine Zwiebel<br>
                        &bull; 1 Knoblauchzehe<br>
                        &bull; 1 Stück Ingwer (ca. 1 cm)<br>
                        &bull; 1 EL Sojasauce<br>
                        &bull; 1 TL Sesamöl<br>
                        &bull; 1 TL Reisessig<br>
                        &bull; Salz und Pfeffer<br>
                        &bull; Optional: Frühlingszwiebeln, Kohl und Karotten

                        <strong class="recipe-section">Zum Braten und Garnieren</strong>
                        &bull; 2 EL Pflanzenöl<br>
                        &bull; ca. 100 ml Wasser<br>
                        &bull; Sesam<br>
                        &bull; Frühlingszwiebeln

                        <strong class="recipe-section">Für den Dip</strong>
                        &bull; 3 EL Sojasauce<br>
                        &bull; 1 EL Reisessig<br>
                        &bull; 1 TL Sesamöl<br>
                        &bull; Optional: Chili oder Chiliflocken

                        <strong class="recipe-section">Zubereitung</strong>
                        <strong class="recipe-step">1. Teig vorbereiten</strong>
                        Mehl, heißes Wasser und Salz in einer Schüssel vermischen. Alles zu einem glatten Teig kneten. Den Teig zu einer Kugel formen, abdecken und etwa 30 Minuten ruhen lassen.

                        <strong class="recipe-step">2. Füllung zubereiten</strong>
                        Hackfleisch oder Tofu, Zwiebel, Knoblauch und Ingwer fein hacken. Alles mit Sojasauce, Sesamöl, Reisessig, Salz und Pfeffer vermischen.

                        <strong class="recipe-step">3. Gyozas formen</strong>
                        Den Teig dünn ausrollen und Kreise von etwa 8–10 cm ausstechen. Jeweils einen Teelöffel Füllung in die Mitte geben. Die Ränder mit etwas Wasser befeuchten, zusammenklappen und gut zusammendrücken.

                        <strong class="recipe-step">4. Gyozas braten</strong>
                        Öl in einer Pfanne erhitzen. Die Gyozas hineingeben und auf der Unterseite goldbraun anbraten. Anschließend ca. 100 ml Wasser hinzufügen und sofort einen Deckel aufsetzen. Bei mittlerer Hitze etwa 5–7 Minuten dämpfen lassen. Danach den Deckel entfernen und das restliche Wasser verdampfen lassen.

                        <strong class="recipe-step">5. Dip zubereiten</strong>
                        Sojasauce, Reisessig und Sesamöl miteinander vermischen. Nach Belieben Chili hinzufügen.

                        <strong class="recipe-step">6. Servieren</strong>
                        Die Gyozas mit Sesam und Frühlingszwiebeln garnieren und zusammen mit dem Dip servieren.

            <button class="flip-card recipe-card lasagne-card" type="button" aria-label="Bild umdrehen" aria-pressed="false">
                <span class="flip-card-inner">
                    <span class="card-face card-front">
                        <img src="clare-andrews-rBhXooUziZc-unsplash.jpg" alt="">
                    </span>
                    <span class="card-face card-back recipe-back lasagne-back" aria-hidden="true">
                        <strong class="recipe-title">Zutaten</strong>
                        <strong class="recipe-subtitle">Lasagne</strong>

                        <strong class="recipe-section"> Lasagne für 3 Personen
                            Hackfleischsauce (Bolognese)</strong>
                        &bull; 300 g Hackfleisch (Rind oder gemischt)<br>
                        &bull; 1 kleine Zwiebel<br>
                        &bull; 1 Knoblauchzehe<br>
                        &bull; 1 kleine Karotte<br>
                        &bull; 400 g gehackte Tomaten (Dose)<br>
                        &bull; 2 EL Tomatenmark<br>
                        &bull; 1 EL Olivenöl<br>
                        &bull; 100 ml Wasser oder Gemüsebouillon<br>
                        &bull; Salz und Pfeffer<br>
                        &bull; 1 TL italienische Kräuter (Oregano, Basilikum)<br>
                        &bull; Optional: etwas Zucker

                        <strong class="recipe-section">Béchamelsauce</strong>
                        &bull; 30 g Butter<br>
                        &bull; 30 g Mehl<br>
                        &bull; 400 ml Milch<br>
                        &bull; Salz und Pfeffer<br>
                        &bull; Eine Prise Muskatnuss

                        <strong class="recipe-section">Für die Lasagne</strong>
                        &bull; ca. 6–9 Lasagneblätter<br>
                        &bull; 100–120 g geriebener Mozzarella<br>
                        &bull; 30 g Parmesan

                        <strong class="recipe-section">Zubereitung</strong>
                        <strong class="recipe-step">1. Hackfleischsauce zubereiten</strong>
                        <span class="recipe-paragraph">Zwiebel, Knoblauch und Karotte fein schneiden. Olivenöl in einer Pfanne erhitzen und das Gemüse kurz anbraten. Hackfleisch dazugeben und krümelig braten, bis es schön gebräunt ist.</span>
                        <span class="recipe-paragraph">Tomatenmark einrühren und kurz mitbraten. Anschließend gehackte Tomaten und Wasser oder Bouillon hinzufügen. Mit Salz, Pfeffer und italienischen Kräutern würzen.</span>
                        <span class="recipe-paragraph">Die Sauce bei niedriger bis mittlerer Hitze etwa 20–25 Minuten köcheln lassen.</span>

                        <strong class="recipe-step">2. Béchamelsauce zubereiten</strong>
                        <span class="recipe-paragraph">Butter in einem Topf schmelzen lassen. Mehl hinzufügen und unter ständigem Rühren etwa eine Minute anschwitzen.</span>
                        <span class="recipe-paragraph">Nach und nach die Milch dazugießen und dabei kräftig mit einem Schneebesen rühren, damit keine Klümpchen entstehen.</span>
                        <span class="recipe-paragraph">Die Sauce einige Minuten köcheln lassen, bis sie cremig wird. Mit Salz, Pfeffer und Muskatnuss abschmecken.</span>

                        <strong class="recipe-step">3. Lasagne schichten</strong>
                        <span class="recipe-paragraph">Eine Auflaufform leicht einfetten. Die Zutaten in dieser Reihenfolge schichten:</span>
                        <span class="recipe-paragraph">&bull; Eine dünne Schicht Hackfleischsauce<br>
                            &bull; Lasagneblätter<br>
                            &bull; Hackfleischsauce<br>
                            &bull; Béchamelsauce<br>
                            &bull; Etwas Mozzarella</span>
                        <span class="recipe-paragraph">Die Schichten wiederholen, bis alle Zutaten aufgebraucht sind. Die oberste Schicht sollte aus Béchamelsauce, Mozzarella und Parmesan bestehen.</span>

                        <strong class="recipe-step">4. Lasagne backen</strong>
                        <span class="recipe-paragraph">Den Backofen auf 180 °C Ober-/Unterhitze vorheizen. Die Lasagne etwa 35–40 Minuten backen, bis die Oberfläche goldbraun und knusprig ist. Falls der Käse zu schnell dunkel wird, kannst du die Form mit Alufolie abdecken.</span>

                        <strong class="recipe-step">5. Servieren</strong>
                        <span class="recipe-paragraph">Die Lasagne nach dem Backen etwa 5–10 Minuten ruhen lassen. Anschließend in Stücke schneiden und servieren.</span>

                        <strong class="recipe-section">Tipps</strong>
                        <span class="recipe-paragraph">&bull; Für mehr Geschmack kannst du einen Schuss Rotwein zur Hackfleischsauce geben.<br>
                            &bull; Je länger die Bolognese köchelt, desto intensiver wird der Geschmack.<br>
                            &bull; Mit frischem Basilikum schmeckt die Lasagne besonders lecker.<br>
                            &bull; Dazu passt ein frischer grüner Salat mit italienischem Dressing.</span>

                        <strong class="recipe-section">Zeitangaben</strong>
                        <span class="recipe-paragraph">&bull; Vorbereitungszeit: ca. 20 Minuten<br>
                            &bull; Kochzeit: ca. 25 Minuten<br>
                            &bull; Backzeit: ca. 35–40 Minuten<br>
                            &bull; Gesamtzeit: ca. 1 Stunde 20 Minuten</span>
                        <strong class="recipe-thanks">Guten Appetit! 🇮🇹❤️</strong>

                        <strong class="recipe-title">Zutaten</strong>
                        <strong class="recipe-subtitle">Pasta Arrabbiata für 3 Personen</strong>

                        <strong class="recipe-section">Für die Pasta</strong>
                        &bull; 300 g Penne oder andere Pasta<br>
                        &bull; 2–3 Liter Wasser<br>
                        &bull; 1 EL Salz

                        <strong class="recipe-section">Für die Arrabbiata-Sauce</strong>
                        &bull; 400 g gehackte Tomaten (Dose)<br>
                        &bull; 2 EL Olivenöl<br>
                        &bull; 3 Knoblauchzehen<br>
                        &bull; 1 kleine Zwiebel<br>
                        &bull; 1–2 Chilischoten oder 1 TL Chiliflocken<br>
                        &bull; 2 EL Tomatenmark<br>
                        &bull; Salz und Pfeffer<br>
                        &bull; 1 TL Oregano<br>
                        &bull; ½ TL Zucker (optional)<br>
                        &bull; Frisches Basilikum

                        <strong class="recipe-section">Zum Garnieren</strong>
                        &bull; 40–50 g geriebener Parmesan<br>
                        &bull; Frisches Basilikum<br>
                        &bull; Etwas Olivenöl

                        <strong class="recipe-section">Zubereitung</strong>
                        <strong class="recipe-step">1. Zutaten vorbereiten</strong>
                        <span class="recipe-paragraph">Zwiebel und Knoblauch fein hacken. Die Chilischoten in kleine Stücke schneiden. Wenn du es weniger scharf magst, kannst du die Kerne entfernen.</span>

                        <strong class="recipe-step">2. Sauce zubereiten</strong>
                        <span class="recipe-paragraph">Olivenöl in einer grossen Pfanne erhitzen. Zwiebeln darin glasig anbraten. Knoblauch und Chili hinzufügen und kurz mitbraten.</span>
                        <span class="recipe-paragraph">Tomatenmark dazugeben und etwa eine Minute anrösten.</span>

                        <strong class="recipe-step">3. Tomatensauce kochen</strong>
                        <span class="recipe-paragraph">Die gehackten Tomaten hinzufügen und alles gut verrühren. Mit Salz, Pfeffer, Oregano und optional etwas Zucker würzen. Die Sauce bei mittlerer bis niedriger Hitze etwa 15–20 Minuten köcheln lassen, damit sie schön aromatisch wird.</span>

                        <strong class="recipe-step">4. Pasta kochen</strong>
                        <span class="recipe-paragraph">Während die Sauce köchelt, einen grossen Topf mit Salzwasser zum Kochen bringen. Die Pasta nach Packungsanleitung al dente kochen. Vor dem Abgiessen eine Tasse Pastawasser aufbewahren.</span>

                        <strong class="recipe-step">5. Pasta mit Sauce vermischen</strong>
                        <span class="recipe-paragraph">Die gekochte Pasta direkt in die Pfanne zur Sauce geben. Alles gut vermischen. Falls die Sauce zu dick ist, etwas Pastawasser hinzufügen.</span>
                          6. Servieren

Die Pasta auf drei Teller verteilen. Mit Parmesan, frischem Basilikum und etwas Olivenöl garnieren.
💡 Tipps
- Für mehr Schärfe kannst du zusätzliche Chiliflocken verwenden.
- Ein Schuss Pastawasser macht die Sauce besonders cremig.
- Verwende hochwertiges Olivenöl für einen intensiveren Geschmack.
- Traditionell wird Arrabbiata mit Penne serviert.
- Wer es besonders würzig mag, kann etwas mehr Knoblauch hinzufügen.
⏱️ Zeitangaben
- Vorbereitungszeit: ca. 10 Minuten
- Kochzeit: ca. 20 Minuten
- Gesamtzeit: ca. 30 Minuten
- Portionen: 3 Personen

                    <span class="card-face card-back" aria-hidden="true">Gebratener Reis – Asiatischer Fried Rice
Rezept für 3 Personen

Ein aromatischer, gebratener Reis mit knackigem Gemüse, Ei und einer würzigen Sojasauce. Schnell zubereitet, lecker und perfekt als Hauptgericht!
🛒 Zutaten
Für den Reis:
- 300 g Basmatireis oder Jasminreis (ungekocht)
- 3 Eier
- 1 kleine Zwiebel
- 2 Knoblauchzehen
- 1 Karotte
- 100 g Erbsen (tiefgekühlt)
- 1 Frühlingszwiebel
- 2–3 EL Sojasauce
- 1 EL Sesamöl
- 2 EL Pflanzenöl
- Salz und Pfeffer
Optional für mehr Geschmack:
- 150 g Pouletbrust
- 1 TL Ingwer (gerieben)
- 1 TL Austernsauce
- Sesam zum Garnieren
- Etwas ChiliZubereitung
1. Reis kochen

Den Reis gründlich mit kaltem Wasser waschen. Anschliessend nach Packungsanleitung kochen.

Den fertigen Reis abkühlen lassen. Am besten verwendest du Reis vom Vortag, da dieser beim Braten schön locker bleibt.

2. Zutaten vorbereiten

Zwiebel und Knoblauch fein hacken. Die Karotte in kleine Würfel schneiden und die Frühlingszwiebel in feine Ringe schneiden.

Falls du Poulet verwendest, dieses in kleine Stücke schneiden.

3. Eier anbraten

Etwas Pflanzenöl in einer grossen Pfanne oder einem Wok erhitzen.

Die Eier in einer Schüssel verquirlen und in die Pfanne geben. Unter Rühren zu Rührei braten. Anschliessend herausnehmen und beiseitestellen.

4. Gemüse anbraten

Etwas Öl in dieselbe Pfanne geben. Zwiebeln und Knoblauch kurz anbraten.

Karotten und Erbsen hinzufügen und etwa 3–4 Minuten braten.

Falls du Poulet verwendest, dieses separat vollständig durchbraten, bevor du das Gemüse hinzufügst.5. Reis braten

Den abgekühlten Reis in die Pfanne geben und alles gut vermischen.

Bei hoher Hitze etwa 3–5 Minuten braten, damit der Reis leicht knusprig wird.

6. Würzen

Sojasauce und Sesamöl hinzufügen. Alles gut vermischen.

Das Rührei wieder dazugeben und mit Pfeffer und bei Bedarf etwas Salz abschmecken.

7. Servieren

Den gebratenen Reis auf drei Teller verteilen.

Mit Frühlingszwiebeln und Sesam garnieren. Nach Belieben etwas Chili hinzufügen.
💡 Tipps
- Reis vom Vortag eignet sich besonders gut, weil er weniger Feuchtigkeit enthält.
- Brate den Reis bei hoher Hitze, damit er nicht matschig wird.
- Verwende nicht zu viel Sojasauce, damit der Reis nicht zu salzig wird.
- Für eine vegetarische Variante einfach das Poulet weglassen.
- Du kannst auch Brokkoli, Mais, Paprika oder Pilze hinzufügen.
⏱️ Zeitangaben
- Vorbereitungszeit: ca. 10 Minuten
- Kochzeit: ca. 20 Minuten
- Gesamtzeit: ca. 30 Minuten
- Portionen: 3 Personen

    <script>
        document.querySelectorAll(".flip-card").forEach((card) => {
            card.addEventListener("pointerenter", () => {
                if (!card.classList.contains("is-flipped")) {
                    card.classList.add("is-hovered");
                }
            });
            card.addEventListener("pointerleave", () => {
                card.classList.remove("is-hovered");
            });
            card.addEventListener("click", () => {
                const isFlipped = card.classList.toggle("is-flipped");
                card.setAttribute("aria-pressed", String(isFlipped));
                card.querySelector(".card-back").setAttribute("aria-hidden", String(!isFlipped));
            });
        });
        
    </script>
